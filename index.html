<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GN Massage - აირჩიეთ ლოკაცია</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans Georgian', sans-serif;
        }

        body {
            background: linear-gradient(rgba(15, 23, 18, 0.85), rgba(10, 15, 12, 0.92)), 
                        url('https://images.unsplash.com/photo-1544161515-4ab6ce6db874?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat fixed;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-align: center;
            padding: 1.5rem;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 3rem 2rem;
            border-radius: 24px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .logo span {
            color: #D4AF37;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #cccccc;
            margin-bottom: 2.5rem;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .location-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.1rem 1.5rem;
            border-radius: 14px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        .btn-tbilisi {
            background: #2C5E3B;
            color: #ffffff;
        }

        .btn-tbilisi:hover {
            background: #367348;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(44, 94, 59, 0.4);
        }

        .btn-bakuriani {
            background: rgba(212, 175, 55, 0.15);
            color: #ffffff;
            border-color: #D4AF37;
        }

        .btn-bakuriani:hover {
            background: #D4AF37;
            color: #121212;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }

        footer-text {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #888888;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="logo">GN <span>MASSAGE</span></div>
        <p class="subtitle">პროფესიონალური მასაჟი & სხეულის აღდგენა<br>გთხოვთ აირჩიოთ ლოკაცია:</p>

        <div class="buttons-container">
            <a href="tbilisi.html" class="location-btn btn-tbilisi">
                📍 მასაჟი თბილისში
            </a>
            <a href="bakuriani.html" class="location-btn btn-bakuriani">
                ❄️ მასაჟი ბაკურიანში
            </a>
        </div>

        <div style="margin-top: 2.5rem; font-size: 0.8rem; color: #aaaaaa;">
            GE | EN | RU
        </div>
    </div>

</body>
</html>
