<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GN Massage - Welcome</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Open Graph -->
    <meta property="og:title" content="GN Massage - პროფესიონალური მასაჟი & სხეულის აღდგენა">
    <meta property="og:description" content="თბილისი & ბაკურიანი — ინდივიდუალურად მორგებული თერაპიული და სამკურნალო მასაჟი.">
    <meta property="og:image" content="logo.png">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Georgian', sans-serif; }
        body { background-color: #0b0f0c; background-image: radial-gradient(circle at center, #16241a 0%, #0b0f0c 75%); height: 100vh; display: flex; align-items: center; justify-content: center; color: #ffffff; text-align: center; padding: 1.5rem; overflow: hidden; }
        
        /* Splash Screen */
        .splash-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #0b0f0c; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; animation: fadeOutSplash 0.8s ease 2.5s forwards; cursor: pointer; }
        
        .splash-logo-img { 
            width: 280px; 
            max-width: 80%; 
            height: auto; 
            opacity: 0; 
            animation: fadeInLogo 1.2s ease 0.3s forwards; 
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.45)); 
        }
        
        .splash-sub { font-size: 0.95rem; letter-spacing: 4px; text-transform: uppercase; color: #D4AF37; margin-top: 1.5rem; opacity: 0; animation: fadeInLogo 1.2s ease 0.8s forwards; font-weight: 600; }
        
        @keyframes fadeInLogo { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOutSplash { 0% { opacity: 1; visibility: visible; } 100% { opacity: 0; visibility: hidden; pointer-events: none; } }
        
        /* Welcome Card */
        .welcome-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(212, 175, 55, 0.22); padding: 3.5rem 2.5rem; border-radius: 32px; max-width: 480px; width: 100%; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7); opacity: 0; animation: fadeInMain 1s ease 2.8s forwards; }
        @keyframes fadeInMain { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
        
        /* პროპორციულად გაზრდილი ლოგო ბარათში */
        .main-logo-img { 
            width: 210px; 
            max-width: 75%; 
            height: auto; 
            margin-bottom: 1.5rem; 
            filter: drop-shadow(0 0 16px rgba(212, 175, 55, 0.38)); 
            transition: transform 0.4s ease;
        }

        .main-logo-img:hover {
            transform: scale(1.03);
        }
        
        .subtitle { font-size: 0.95rem; color: #a0a0a0; margin-bottom: 2.4rem; font-weight: 300; line-height: 1.6; min-height: 2.7em; }
        .buttons-container { display: flex; flex-direction: column; gap: 1.2rem; }
        .location-btn { display: flex; align-items: center; justify-content: center; padding: 1.15rem 1.5rem; border-radius: 16px; text-decoration: none; font-size: 1.05rem; font-weight: 600; transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-tbilisi { background: linear-gradient(135deg, #1e4027, #2c5e3b); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-tbilisi:hover { background: linear-gradient(135deg, #255232, #367348); transform: translateY(-3px); box-shadow: 0 10px 25px rgba(44, 94, 59, 0.4); }
        .btn-bakuriani { background: rgba(212, 175, 55, 0.08); color: #ffffff; border: 1px solid #D4AF37; }
        .btn-bakuriani:hover { background: #D4AF37; color: #0b0f0c; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(212, 175, 55, 0.35); }
        .lang-switch { margin-top: 2.2rem; font-size: 0.85rem; color: #666666; letter-spacing: 1px; }
        .lang-btn { background: none; border: none; color: #777777; font-size: 0.85rem; font-weight: 600; cursor: pointer; padding: 0.2rem 0.5rem; transition: color 0.3s ease; }
        .lang-btn:hover { color: #ffffff; }
        .lang-btn.active { color: #D4AF37; border-bottom: 2px solid #D4AF37; }
        
        /* Mobile Responsive adjustment */
        @media (max-width: 480px) { 
            .welcome-card { padding: 2.8rem 1.6rem; } 
            .splash-logo-img { width: 220px; } 
            .main-logo-img { width: 170px; margin-bottom: 1.2rem; } 
            .subtitle { font-size: 0.9rem; margin-bottom: 2rem; }
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div class="splash-screen">
        <img src="logo.png" alt="GN Massage" class="splash-logo-img">
        <div class="splash-sub">Therapy & Wellness</div>
    </div>

    <!-- Main Welcome Card -->
    <div class="welcome-card">
        <img src="logo.png" alt="GN Massage" class="main-logo-img">
        <p class="subtitle" id="sub-text">პროფესიონალური მასაჟი & სხეულის აღდგენა<br>აირჩიეთ სასურველი ლოკაცია:</p>

        <div class="buttons-container">
            <a href="tbilisi.html" class="location-btn btn-tbilisi" id="btn-tbilisi-text">📍 მასაჟი თბილისში</a>
            <a href="bakuriani.html" class="location-btn btn-bakuriani" id="btn-bakuriani-text">❄️️ მასაჟი ბაკურიანში</a>
        </div>

        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLanguage('ka')">GE</button> | 
            <button class="lang-btn" onclick="setLanguage('en')">EN</button> | 
            <button class="lang-btn" onclick="setLanguage('ru')">RU</button>
        </div>
    </div>

    <script>
        const translations = {
            ka: { subtitle: "პროფესიონალური მასაჟი & სხეულის აღდგენა<br>აირჩიეთ სასურველი ლოკაცია:", btnTbilisi: "📍 მასაჟი თბილისში", btnBakuriani: "❄️ მასაჟი ბაკურიანში" },
            en: { subtitle: "Professional Massage & Body Recovery<br>Please select location:", btnTbilisi: "📍 Massage in Tbilisi", btnBakuriani: "❄️ Massage in Bakuriani" },
            ru: { subtitle: "Профессиональный массаж и восстановление<br>Выберите локацию:", btnTbilisi: "📍 Массаж в Тбилиси", btnBakuriani: "❄️ Массаж в Бакуриани" }
        };

        function setLanguage(lang) {
            localStorage.setItem('gn_massage_lang', lang);
            document.getElementById('sub-text').innerHTML = translations[lang].subtitle;
            document.getElementById('btn-tbilisi-text').innerHTML = translations[lang].btnTbilisi;
            document.getElementById('btn-bakuriani-text').innerHTML = translations[lang].btnBakuriani;

            const buttons = document.querySelectorAll('.lang-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (lang === 'ka') buttons[0].classList.add('active');
            if (lang === 'en') buttons[1].classList.add('active');
            if (lang === 'ru') buttons[2].classList.add('active');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('gn_massage_lang') || 'ka';
            setLanguage(savedLang);
        });
    </script>
</body>
</html>
