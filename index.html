    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GN Massage - აირჩიეთ ლოკაცია / Select Location</title>

    <!-- Circular Favicon Integration -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%230b0f0c' stroke='%23D4AF37' stroke-width='3'/><image href='logo.png' x='15' y='15' width='70' height='70'/></svg>">
    <link rel="alternate icon" type="image/png" href="logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Georgian', sans-serif; }
        body {
            background-color: #0b0f0c;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #16241a 0%, #0b0f0c 80%);
            padding: 1.5rem;
        }

        .portal-card {
            background: rgba(17, 23, 19, 0.95);
            border: 1px solid #D4AF37;
            border-radius: 24px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 30px rgba(212, 175, 55, 0.2);
        }

        .logo-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #D4AF37;
            margin-bottom: 1.2rem;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .portal-title {
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 0.4rem;
        }

        .portal-title span { color: #D4AF37; }

        .portal-subtitle {
            color: #a0a0a0;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .location-grid {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .location-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #ffffff;
            padding: 1.2rem;
            border-radius: 18px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .location-btn:hover {
            background: linear-gradient(135deg, #1e4027, #2c5e3b);
            border-color: #D4AF37;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(44, 94, 59, 0.5);
        }

        .loc-info { text-align: left; }
        .loc-name { font-size: 1.15rem; font-weight: 700; color: #ffffff; }
        .loc-desc { font-size: 0.8rem; color: #D4AF37; margin-top: 0.2rem; }
        .arrow { font-size: 1.2rem; color: #D4AF37; }
    </style>
</head>
<body>

    <div class="portal-card">
        <img src="logo.png" alt="GN Massage Logo" class="logo-img">
        <h1 class="portal-title">GN <span>MASSAGE</span></h1>
        <p class="portal-subtitle">აირჩიეთ ლოკაცია / Select Location</p>

        <div class="location-grid">
            <!-- Tbilisi Option -->
            <a href="tbilisi.html" class="location-btn">
                <div class="loc-info">
                    <div class="loc-name">📍 თბილისი (Tbilisi)</div>
                    <div class="loc-desc">საბურთალო • Saburtalo</div>
                </div>
                <div class="arrow">→</div>
            </a>

            <!-- Bakuriani Option -->
            <a href="bakuriani.html" class="location-btn">
                <div class="loc-info">
                    <div class="loc-name">📍 ბაკურიანი (Bakuriani)</div>
                    <div class="loc-desc">სეზონური კაბინეტი • Resort Cabinet</div>
                </div>
                <div class="arrow">→</div>
            </a>
        </div>
    </div>

</body>
</html>
