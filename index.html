<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GN Massage - აირჩიეთ ლოკაცია / Choose Location</title>
    
    <!-- SEO & Metadata -->
    <meta name="description" content="GN Massage - პროფესიონალური თერაპიული, სამკურნალო და აღდგენითი მასაჟი თბილისსა (საბურთალო) და ბაკურიანში.">
    <meta name="keywords" content="GN Massage, მასაჟი თბილისში, მასაჟი საბურთალოზე, მასაჟი ბაკურიანში, სამკურნალო მასაჟი">

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HealthAndBeautyBusiness",
      "name": "GN Massage",
      "image": "https://gn-massage.vercel.app/logo.png",
      "url": "https://gn-massage.vercel.app/",
      "telephone": "+995557998522",
      "priceRange": "75 GEL - 110 GEL",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "GE"
      }
    }
    </script>

    <!-- Circular Favicon Integration -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%230b0f0c' stroke='%23D4AF37' stroke-width='3'/><image href='logo.png' x='15' y='15' width='70' height='70'/></svg>">
    <link rel="alternate icon" type="image/png" href="logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Georgian', sans-serif; }
        body { background-color: #0b0f0c; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; overflow-x: hidden; }

        /* 3-Second Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0f0c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* Extra Large Pure Glowing Logo Effect */
        .splash-logo {
            width: 280px;
            height: auto;
            max-height: 280px;
            object-fit: contain;
            border: none;
            border-radius: 0;
            padding: 0;
            animation: pulseGlowLogo 2.2s infinite ease-in-out;
        }

        @keyframes pulseGlowLogo {
            0% {
                transform: scale(0.96);
                filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.45));
            }
            50% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 45px rgba(212, 175, 55, 0.9));
            }
            100% {
                transform: scale(0.96);
                filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.45));
            }
        }

        /* Main Content Visuals */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
            max-width: 600px;
            width: 100%;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease forwards;
            animation-delay: 3s; /* Appears right after splash */
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid #D4AF37;
            margin-bottom: 1.5rem;
            object-fit: cover;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        }

        .brand-title {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }
        .brand-title span { color: #D4AF37; }

        .brand-subtitle {
            font-size: 1rem;
            color: #a0a0a0;
            font-weight: 300;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        /* Premium Buttons Style */
        .location-buttons {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            width: 100%;
        }

        .loc-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(212, 175, 55, 0.05));
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 1.2rem 1.8rem;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.35s ease;
            backdrop-filter: blur(10px);
        }

        .loc-btn:hover {
            border-color: #D4AF37;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(30, 64, 39, 0.3));
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.15);
        }

        .loc-info { text-align: left; }
        .loc-title { font-size: 1.2rem; font-weight: 600; color: #ffffff; }
        .loc-sub { font-size: 0.85rem; color: #D4AF37; margin-top: 0.2rem; }
        .loc-arrow { font-size: 1.4rem; color: #D4AF37; transition: transform 0.3s; }
        .loc-btn:hover .loc-arrow { transform: translateX(5px); }

        footer {
            padding: 1.5rem;
            font-size: 0.85rem;
            color: #555;
            width: 100%;
        }

        /* Responsive Mobile Styles */
        @media (max-width: 480px) {
            .splash-logo {
                width: 250px;
                max-height: 250px;
            }
            .brand-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- 3-Second Splash Screen -->
    <div id="splash-screen">
        <img src="logo.png" alt="GN Massage Logo" class="splash-logo">
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <img src="logo.png" alt="GN Massage Logo" class="brand-logo">
        <h1 class="brand-title">GN <span>MASSAGE</span></h1>
        <p class="brand-subtitle">აირჩიეთ სასურველი ლოკაცია / Select Location</p>

        <div class="location-buttons">
            <!-- Tbilisi Button -->
            <a href="tbilisi.html" class="loc-btn">
                <div class="loc-info">
                    <div class="loc-title">📍 თბილისი / Tbilisi</div>
                    <div class="loc-sub">საბურთალო • Saburtalo Cabinet</div>
                </div>
                <div class="loc-arrow">→</div>
            </a>

            <!-- Bakuriani Button -->
            <a href="bakuriani.html" class="loc-btn">
                <div class="loc-info">
                    <div class="loc-title">🏔️ ბაკურიანი / Bakuriani</div>
                    <div class="loc-sub">სეზონური ლოკაცია • Seasonal Location</div>
                </div>
                <div class="loc-arrow">→</div>
            </a>
        </div>
    </div>

    <footer>© 2026 GN Massage. All rights reserved.</footer>

    <script>
        // Automatic 3-Second Splash Screen Disappear
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.classList.add('fade-out');
                }
            }, 3000); // 3000ms = 3 seconds
        });
    </script>
</body>
</html>
